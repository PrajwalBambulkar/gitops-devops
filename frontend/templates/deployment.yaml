apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-{{ .Values.color }}
  labels:
    app: frontend
    color: {{ .Values.color }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: frontend
      color: {{ .Values.color }}
  template:
    metadata:
      labels:
        app: frontend
        color: {{ .Values.color }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.containerPort }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 20
            periodSeconds: 10
