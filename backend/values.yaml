replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

image:
  repository: prajwalbambulkar/backend
  tag: backend-11
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

containerPort: 3000

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

config:
  DB_HOST: mysql
  DB_NAME: testdb
  DB_PORT: "3306"

secret:
  DB_USER: root
  DB_PASS: yourpassword

pdb:
  enabled: true
  minAvailable: 1
