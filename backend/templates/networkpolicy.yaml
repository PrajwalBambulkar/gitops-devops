apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: backend-network-policy

spec:
  podSelector:
    matchLabels:
      app: backend

  policyTypes:
    - Ingress
    - Egress

  ingress:

    - from:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: frontend

          podSelector:
            matchLabels:
              app: frontend

      ports:

        - protocol: TCP
          port: 3000

  egress:

    # Allow DNS resolution through CoreDNS
    - to:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

          podSelector:
            matchLabels:
              k8s-app: kube-dns

      ports:

        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53

    # Allow backend to connect to MySQL
    - to:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend

          podSelector:
            matchLabels:
              app: mysql

      ports:

        - protocol: TCP
          port: 3306
