apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: backend-network-policy

spec:
  podSelector:
    matchLabels:
      app: backend

  policyTypes:
    - Ingress
    - Egress

  ingress:

    - from:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: frontend

          podSelector:
            matchLabels:
              app: frontend

      ports:

        - protocol: TCP
          port: 3000

  egress:

    - to:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend

          podSelector:
            matchLabels:
              app: mysql

      ports:

        - protocol: TCP
          port: 3306
